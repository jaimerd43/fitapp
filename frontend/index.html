<!DOCTYPE html>
<html lang="es">
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitApp Calorías</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/static/manifest.json" />
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-white shadow-md rounded-lg p-6 space-y-6">

    <!-- Login / Registro -->
    <div id="auth">
      <h1 class="text-2xl font-bold text-center mb-2">Iniciar sesión</h1>
      <input id="email" type="email" placeholder="Email" class="w-full p-2 border rounded mb-2" />
      <input id="password" type="password" placeholder="Contraseña" class="w-full p-2 border rounded mb-2" />

      <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Entrar</button>
      <p class="text-center mt-2 text-sm text-gray-500">¿No tienes cuenta? <a href="#" onclick="registrar()" class="underline">Registrarme</a></p>
    </div>

    <!-- Subir Imagen -->
    <div id="app" class="hidden">
      <h1 class="text-2xl font-bold text-center mb-4">Analiza tu comida</h1>
      <input type="file" accept="image/*" capture="environment" id="foto" class="w-full p-2 border rounded mb-4" />
      <img id="preview" class="w-full h-auto mb-4 hidden rounded shadow" />
      <button onclick="enviarFoto()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Procesar Foto</button>
      <div id="cargando" class="mt-4 text-center text-blue-600 hidden">Procesando...</div>
      <pre id="resultado" class="mt-4 whitespace-pre-wrap text-sm text-gray-800"></pre>
    </div>

    <!-- Ajustes posteriores al análisis -->
    <div id="chat-box" class="hidden">
      <h2 class="text-lg font-semibold mt-4">¿Quieres ajustar el análisis?</h2>
      <textarea id="ajuste-input" rows="2" placeholder="Ej: usé mantequilla en vez de aceite" class="w-full p-2 border rounded mt-2"></textarea>
      <button onclick="enviarAjuste()" class="mt-2 w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Enviar Ajuste</button>
      <button onclick="guardarResultadoFinal()" class="mt-2 w-full bg-emerald-600 text-white py-2 rounded hover:bg-emerald-700">
        ✅ Guardar resultado final
      </button>
      <div id="conversacion" class="mt-4 flex flex-col space-y-2 text-sm text-gray-800"></div>
    </div>
    

  </div>
  <script src="/static/script.js"></script>
</body>
</html>
